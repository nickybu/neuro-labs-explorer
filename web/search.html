<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discover labs — Neuro Labs Explorer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topbar">
    <h1><span class="brand">◧</span> Neuro Labs Explorer</h1>
    <nav>
      <a href="index.html">Graph</a>
      <a href="search.html" class="active">Search</a>
    </nav>
    <div class="spacer"></div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="search-page">
    <div class="search-hero">
      <input class="big-input" id="q" placeholder="Search by name, topic, institution, method, organism, city or paper title — e.g. “zebrafish optogenetics”, “Oxford”, “Friston”" autocomplete="off" autofocus />
      <div class="sub">Keyword search across PIs, their topics, institutions, method / model-system tags, places and recent paper titles. Every match is a real OpenAlex record.</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="count-note" id="countNote"></div>
    <div class="results" id="results"></div>
  </div>

  <script src="data.js"></script>
  <script>
  (async function () {
    let data, tags, works;
    try { [data, tags, works] = await Promise.all([loadData(), loadTags(), loadWorks()]); }
    catch (e) { document.getElementById("results").textContent = e.message; return; }
    const { byId } = indexGraph(data);
    const tagLabel = new Map();
    if (tags) for (const g of ["methods", "organisms"]) for (const t of tags.tags[g]) tagLabel.set(t.id, t.label);
    const tagRec = (id) => (tags && tags.pis[id]) || null;
    const c = data.meta.counts || {};
    document.getElementById("stats").textContent =
      `${fmtInt(c.pis)} PIs · ${fmtInt((c.pis_by_status || {}).active)} active · ${data._source}`;

    // Each haystack is built ONCE. The old version re-joined and re-lowercased
    // every PI's topic array on every keystroke, for every record.
    const records = data.nodes.filter((n) => n.type === "pi").map((pi) => {
      const inst = byId.get(pi.institution);
      const rec = tagRec(pi.id);
      const wl = (works && works.pis[pi.id]) || [];
      const parts = [pi.label, inst ? inst.label : "", inst ? placeOf(inst) : "",
                     pi.primaryTopic, (pi.topics || []).join(" ")];
      if (rec) for (const g of ["m", "o"]) for (const t of Object.keys(rec[g] || {})) parts.push(tagLabel.get(t) || t);
      for (const w of wl) parts.push(w[1]);
      return { pi, inst, rec, wl, instLabel: inst ? inst.label : "", haystack: parts.join(" \n ").toLowerCase() };
    });

    // Status chips replace the old research-area chips: within a single field
    // the useful cut is whether the lab is still running.
    const chipsBox = document.getElementById("chips");
    let activeChip = "active";
    for (const [key, label] of Object.entries(STATUS_LABELS)) {
      const el = document.createElement("span");
      el.className = "chip" + (key === activeChip ? " active" : "");
      el.textContent = label;
      el.dataset.status = key;
      el.addEventListener("click", () => {
        activeChip = activeChip === key ? null : key;
        [...chipsBox.children].forEach((x) =>
          x.classList.toggle("active", x.dataset.status === activeChip));
        render(qEl.value);
      });
      chipsBox.appendChild(el);
    }

    const results = document.getElementById("results");
    const countNote = document.getElementById("countNote");
    const qEl = document.getElementById("q");

    function scoreRecord(r, terms) {
      let s = 0;
      for (const t of terms) {
        if (!r.haystack.includes(t)) return -1;   // require all terms
        if (r.pi.label.toLowerCase().includes(t)) s += 5;
        if ((r.pi.primaryTopic || "").toLowerCase().includes(t)) s += 4;
        if (r.instLabel.toLowerCase().includes(t)) s += 2;
        let hits = 0;
        for (const w of r.wl) if (w[1].toLowerCase().includes(t) && ++hits >= 5) break;
        s += 1 + hits;
      }
      // Recency and prominence as a gentle tiebreak - a currently running lab
      // should outrank a bigger one that stopped publishing a decade ago.
      if (r.pi.status === "active") s += 2;
      return s + Math.min(r.pi.works || 0, 60) / 120;
    }

    function highlight(text, terms) {
      let out = escapeHTML(text);
      for (const t of terms) {
        if (!t) continue;
        out = out.replace(
          new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "ig"), "<mark>$1</mark>");
      }
      return out;
    }

    function render(query) {
      const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
      let matched = records;
      if (activeChip) matched = matched.filter((r) => r.pi.status === activeChip);
      if (terms.length) {
        const scored = [];
        for (const r of matched) {
          const s = scoreRecord(r, terms);
          if (s >= 0) scored.push({ r, s });
        }
        scored.sort((a, b) => b.s - a.s);
        matched = scored.map((x) => x.r);
      } else {
        matched = [...matched].sort((a, b) => (b.pi.works || 0) - (a.pi.works || 0));
      }
      const shown = matched.slice(0, 60);
      countNote.textContent = `${fmtInt(matched.length)} matching lab${matched.length === 1 ? "" : "s"}` +
        (matched.length > 60 ? " (showing top 60)" : "");
      results.innerHTML = shown.map((r) => cardHTML(r, terms)).join("") ||
        `<div class="count-note">No labs match. Try a broader term or a topic keyword.</div>`;
    }

    // Up to two recent paper titles that contain a search term.
    function pubHits(r, terms) {
      if (!terms.length || !r.wl.length) return "";
      const hits = r.wl.filter((w) => terms.some((t) => w[1].toLowerCase().includes(t))).slice(0, 2);
      if (!hits.length) return "";
      return `<div class="rc-pubs">${hits.map((w) => `<div><span class="yr">${w[0] || ""}</span>${highlight(w[1], terms)}</div>`).join("")}</div>`;
    }

    function cardHTML(r, terms) {
      const { pi } = r;
      const topics = (pi.topics || []).slice(0, 4).join(" · ");
      const col = STATUS_COLORS[pi.status] || "#f0883e";
      return `<div class="result-card">
        <div class="rc-top">
          <h3>${highlight(pi.label, terms)}</h3>
          <span class="inst">${highlight(r.instLabel, terms)}${r.inst && placeOf(r.inst) ? " · " + highlight(placeOf(r.inst), terms) : ""}</span>
        </div>
        <div class="rc-topic">${highlight(pi.primaryTopic || "", terms)}</div>
        <div class="tags">
          <span class="tag" style="background:${col}22;color:${col}">${escapeHTML(STATUS_LABELS[pi.status] || "")}</span>
          <span class="tag">${yearSpan(pi)}</span>
          ${r.rec ? tagChipsHTML(r.rec, tagLabel, 4) : ""}
        </div>
        <div class="rc-metrics">${highlight(topics, terms)}</div>
        ${pubHits(r, terms)}
        <div class="rc-metrics" style="margin-top:6px">${fmtInt(pi.works)} last-authored ·
          ${pi.citations ? fmtInt(pi.citations) + " citations · " : ""}
          <a href="index.html#${encodeURIComponent(pi.id)}">view in graph</a> ·
          <a href="https://openalex.org/${escapeHTML(pi.id)}" target="_blank" rel="noopener">OpenAlex ↗</a></div>
      </div>`;
    }

    // Debounced: at continental scale an undebounced scan per keystroke is
    // hundreds of milliseconds of blocked main thread per character.
    let t = null;
    qEl.addEventListener("input", (e) => {
      const v = e.target.value;
      if (t) clearTimeout(t);
      t = setTimeout(() => { t = null; render(v); }, 200);
    });
    render("");
  })();
  </script>
</body>
</html>
